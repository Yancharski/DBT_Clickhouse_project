version: "3.9"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.3.20
    container_name: clickhouse
    restart: unless-stopped
    env_file:
      - .env

    ulimits:
      nofile:
        soft: 262144
        hard: 262144

    environment:
      CLICKHOUSE_USER: ${CH_ADMIN_USER}
      CLICKHOUSE_PASSWORD: ${CH_ADMIN_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CH_INGEST_USER: ${CH_INGEST_USER}
      CH_INGEST_PASSWORD: ${CH_INGEST_PASSWORD}
      CH_DBT_USER: ${CH_DBT_USER}
      CH_DBT_PASSWORD: ${CH_DBT_PASSWORD}

    ports:
      - "${CH_HTTP_PORT:-8123}:8123"
      - "${CH_NATIVE_PORT:-9000}:9000"

    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse/initdb:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user ${CH_ADMIN_USER} --password ${CH_ADMIN_PASSWORD} --query 'SELECT 1' >/dev/null || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  dbt:
    build:
      context: ./dbt
      dockerfile: Dockerfile
    container_name: dbt_clickhouse
    env_file:
      - .env
    environment:
      DBT_PROFILES_DIR: /root/.dbt
      CH_DBT_HOST: clickhouse
      CH_DBT_PORT: 8123
    working_dir: /opt/dbt
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./dbt:/opt/dbt
      - ./dbt/profiles:/root/.dbt:ro
    ports:
      - "${DBT_DOCS_PORT:-8081}:8081"

volumes:
  clickhouse_data:
  clickhouse_logs:
